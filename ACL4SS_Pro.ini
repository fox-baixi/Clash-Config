[custom]
;自定义配置文件 - 从YAML生成
;生成时间: 2025-12-05
;规则来源: GitHub 自动更新仓库
;所有规则和代理组完全从YAML提取

;规则集定义 - 按代理组顺序排列
ruleset=🔰国外流量,https://gist.githubusercontent.com/fox-baixi/128a370090d45e8da2bf3dd2bca2f0e7/raw/Proxy.list
ruleset=✈️Telegram,https://gist.githubusercontent.com/fox-baixi/128a370090d45e8da2bf3dd2bca2f0e7/raw/Telegram.list
ruleset=🎬Youtube,https://gist.githubusercontent.com/fox-baixi/128a370090d45e8da2bf3dd2bca2f0e7/raw/Youtube.list
ruleset=🎬Netflix,https://gist.githubusercontent.com/fox-baixi/128a370090d45e8da2bf3dd2bca2f0e7/raw/Netflix.list
ruleset=🎬哔哩哔哩,https://gist.githubusercontent.com/fox-baixi/128a370090d45e8da2bf3dd2bca2f0e7/raw/Bilibili.list
ruleset=🎬国外媒体,https://gist.githubusercontent.com/fox-baixi/128a370090d45e8da2bf3dd2bca2f0e7/raw/Media.list
ruleset=🍎苹果服务,https://gist.githubusercontent.com/fox-baixi/128a370090d45e8da2bf3dd2bca2f0e7/raw/Apple.list
ruleset=⚓️其他流量,[]FINAL
ruleset=DIRECT,[]GEOIP,CN
ruleset=DIRECT,https://gist.githubusercontent.com/fox-baixi/128a370090d45e8da2bf3dd2bca2f0e7/raw/Direct.list

;代理组定义 - 按指定顺序排列
custom_proxy_group=🔰国外流量`select`.*
custom_proxy_group=⚓️其他流量`select`[]🔰国外流量`[]🚀直接连接`.*
custom_proxy_group=✈️Telegram`select`[]🔰国外流量`.*
custom_proxy_group=🎬Youtube`select`[]🔰国外流量`.*
custom_proxy_group=🎬Netflix`select`[]🔰国外流量`.*
custom_proxy_group=🎬哔哩哔哩`select`[]🚀直接连接`.*
custom_proxy_group=🎬国外媒体`select`[]🔰国外流量`.*
custom_proxy_group=🍎苹果服务`select`[]🚀直接连接`[]🔰国外流量
custom_proxy_group=🚀直接连接`select`[]DIRECT

enable_rule_generator=true
overwrite_original_rules=true