name: Update Clash Rules

on:
  schedule:
    # 每天北京时间 8:00 和 20:00 运行 (UTC 0:00 和 12:00)
    - cron: '0 0 * * 1'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write  # 允许写入仓库内容

jobs:
  update-rules:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史以便比对
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install pyyaml requests
      
      - name: Download and validate YAML
        id: download
        run: |
          python download_yaml.py
        continue-on-error: true
      
      - name: Send failure notification
        if: steps.download.outputs.status == 'failed' || steps.download.outputs.status == 'invalid'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: '⚠️ Clash 配置更新失败 - ${{ github.repository }}'
          to: ${{ secrets.MAIL_TO }}
          from: GitHub Actions
          body: |
            仓库: ${{ github.repository }}
            时间: ${{ github.event.repository.updated_at }}
            状态: ${{ steps.download.outputs.status }}
            
            错误信息:
            ${{ steps.download.outputs.error_message }}
            
            请检查:
            1. 订阅链接是否过期
            2. config.ini 中的 URL 是否正确
            3. 网络连接是否正常
            
            查看详情: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true
      
      - name: Stop if validation failed
        if: steps.download.outputs.status == 'failed' || steps.download.outputs.status == 'invalid'
        run: |
          echo "YAML 验证失败，停止执行"
          exit 1
      
      - name: Generate list files
        if: steps.download.outputs.changed == 'true'
        run: |
          python generate_list_files.py
      
      - name: Commit and push if changed
        if: steps.download.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Clash/*.list source.yaml
          
          # 检查是否有变化
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔄 Auto update: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
