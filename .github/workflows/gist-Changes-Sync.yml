name: gist Changes Sync

on:
  push:
    branches:
      - main
    paths:
      - 'Clash/**'              # Clash 文件夹下任何文件变化都触发
  workflow_dispatch:            # 允许手动触发

permissions:
  contents: write

jobs:
  sync-changes:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check Clash folder
        id: check
        run: |
          if [ -d "Clash" ]; then
            echo "📁 检测到 Clash 文件夹变化，准备同步到 Gist"
          else
            echo "❌ Clash 文件夹不存在"
            exit 1
          fi
      
      - name: Sync to Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: 128a370090d45e8da2bf3dd2bca2f0e7
        run: |
          # 克隆 Gist 仓库
          git clone https://${GIST_TOKEN}@gist.github.com/${GIST_ID}.git gist-repo
          
          # 检查文件是否有变化
          echo "检查文件变化..."
          HAS_CHANGES=false
          CHANGED_FILES=""
          
          # 检查 .list 文件
          for file in Clash/*.list; do
            filename=$(basename "$file")
            if [ ! -f "gist-repo/$filename" ]; then
              echo "  新文件: $filename"
              HAS_CHANGES=true
              CHANGED_FILES="$CHANGED_FILES $file"
            elif ! cmp -s "$file" "gist-repo/$filename"; then
              echo "  已更新: $filename"
              HAS_CHANGES=true
              CHANGED_FILES="$CHANGED_FILES $file"
            else
              echo "  无变化: $filename"
            fi
          done
          
          # 检查 .ini 文件
          for file in Clash/*.ini; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              if [ ! -f "gist-repo/$filename" ]; then
                echo "  新文件: $filename"
                HAS_CHANGES=true
                CHANGED_FILES="$CHANGED_FILES $file"
              elif ! cmp -s "$file" "gist-repo/$filename"; then
                echo "  已更新: $filename"
                HAS_CHANGES=true
                CHANGED_FILES="$CHANGED_FILES $file"
              else
                echo "  无变化: $filename"
              fi
            fi
          done

          # 检查 .yaml 文件
          for file in Clash/*.yaml; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              if [ ! -f "gist-repo/$filename" ]; then
                echo "  新文件: $filename"
                HAS_CHANGES=true
                CHANGED_FILES="$CHANGED_FILES $file"
              elif ! cmp -s "$file" "gist-repo/$filename"; then
                echo "  已更新: $filename"
                HAS_CHANGES=true
                CHANGED_FILES="$CHANGED_FILES $file"
              else
                echo "  无变化: $filename"
              fi
            fi
          done
          
          if [ "$HAS_CHANGES" = false ]; then
            echo "✓ 所有文件内容相同，跳过 Gist 更新"
            exit 0
          fi
          
          # 只复制有变化的文件到 Gist
          echo "同步到 Gist..."
          for file in $CHANGED_FILES; do
            filename=$(basename "$file")
            echo "  复制: $filename"
            cp "$file" "gist-repo/$filename"
          done
          
          # 提交并推送
          cd gist-repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          
          # 只添加有变化的文件
          for file in $CHANGED_FILES; do
            filename=$(basename "$file")
            git add "$filename"
          done
          
          if git diff --staged --quiet; then
            echo "Gist 无需更新"
          else
            git commit -m "🔄 Manual update from GitHub: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
            echo "✅ 已同步到 Gist"
          fi
