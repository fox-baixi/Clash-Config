name: Manual Changes Sync

on:
  push:
    branches:
      - main
    paths:
      - 'Clash/**'              # Clash 文件夹下任何文件变化都触发
      - 'source.yaml'           # YAML 源文件变化也触发
  workflow_dispatch:            # 允许手动触发

permissions:
  contents: write

jobs:
  sync-changes:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install pyyaml
      
      - name: Check what changed
        id: changes
        run: |
          echo "📋 检测触发原因..."
          
          # 因为 workflow 已经通过 paths 过滤触发
          # 所以触发时一定是 Clash/** 或 source.yaml 有变化
          
          # 检查是否存在 source.yaml
          if [ -f "source.yaml" ]; then
            echo "source_changed=true" >> $GITHUB_OUTPUT
            echo "📝 将处理 source.yaml"
          else
            echo "source_changed=false" >> $GITHUB_OUTPUT
          fi
          
          # 检查是否存在 Clash 文件夹
          if [ -d "Clash" ]; then
            echo "clash_exists=true" >> $GITHUB_OUTPUT
            echo "📁 Clash 文件夹存在，将同步到 Gist"
          else
            echo "clash_exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Regenerate rules from YAML
        if: steps.changes.outputs.source_changed == 'true'
        run: |
          echo "从 source.yaml 重新生成规则文件..."
          python generate_list_files.py
      
      - name: Commit regenerated files
        if: steps.changes.outputs.source_changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Clash/*.list
          
          if git diff --staged --quiet; then
            echo "没有生成新的变化"
          else
            git commit -m "🔄 根据 source.yaml 更新生成规则列表"
            git push
          fi
      
      - name: Sync to Gist
        if: steps.changes.outputs.clash_exists == 'true'
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: 128a370090d45e8da2bf3dd2bca2f0e7
        run: |
          # 克隆 Gist 仓库
          git clone https://${GIST_TOKEN}@gist.github.com/${GIST_ID}.git gist-repo
          
          # 检查文件是否有变化
          echo "检查文件变化..."
          HAS_CHANGES=false
          CHANGED_FILES=""
          
          # 检查 .list 文件
          for file in Clash/*.list; do
            filename=$(basename "$file")
            if [ ! -f "gist-repo/$filename" ]; then
              echo "  新文件: $filename"
              HAS_CHANGES=true
              CHANGED_FILES="$CHANGED_FILES $file"
            elif ! cmp -s "$file" "gist-repo/$filename"; then
              echo "  已更新: $filename"
              HAS_CHANGES=true
              CHANGED_FILES="$CHANGED_FILES $file"
            else
              echo "  无变化: $filename"
            fi
          done
          
          # 检查 .ini 文件
          for file in Clash/*.ini; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              if [ ! -f "gist-repo/$filename" ]; then
                echo "  新文件: $filename"
                HAS_CHANGES=true
                CHANGED_FILES="$CHANGED_FILES $file"
              elif ! cmp -s "$file" "gist-repo/$filename"; then
                echo "  已更新: $filename"
                HAS_CHANGES=true
                CHANGED_FILES="$CHANGED_FILES $file"
              else
                echo "  无变化: $filename"
              fi
            fi
          done
          
          if [ "$HAS_CHANGES" = false ]; then
            echo "✓ 所有文件内容相同，跳过 Gist 更新"
            exit 0
          fi
          
          # 只复制有变化的文件到 Gist
          echo "同步到 Gist..."
          for file in $CHANGED_FILES; do
            filename=$(basename "$file")
            echo "  复制: $filename"
            cp "$file" "gist-repo/$filename"
          done
          
          # 提交并推送
          cd gist-repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          
          # 只添加有变化的文件
          for file in $CHANGED_FILES; do
            filename=$(basename "$file")
            git add "$filename"
          done
          
          if git diff --staged --quiet; then
            echo "Gist 无需更新"
          else
            git commit -m "🔄 Manual update from GitHub: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
            echo "✅ 已同步到 Gist"
          fi
