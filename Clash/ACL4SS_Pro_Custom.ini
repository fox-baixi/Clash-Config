[custom]
;自定义配置文件 - 基于很有精神.yaml修改
;生成时间: 2026-01-08
;规则来源: GitHub 自动更新仓库 + 本地提取
;所有规则和代理组完全从YAML提取
;ini配置地址 https://gist.githubusercontent.com/fox-baixi/128a370090d45e8da2bf3dd2bca2f0e7/raw/ACL4SS_Pro_Custom.ini

;规则集定义 - 按代理组顺序排列
ruleset=⛔️广告拦截,[]GEOIP,ad
ruleset=⛔️广告拦截,[]GEOSITE,category-ads-all
ruleset=🔰国外流量,https://gist.githubusercontent.com/fox-baixi/128a370090d45e8da2bf3dd2bca2f0e7/raw/foreign.list
ruleset=🔰国外流量,https://gist.githubusercontent.com/fox-baixi/128a370090d45e8da2bf3dd2bca2f0e7/raw/foreign+.list
ruleset=✈️Telegram,[]GEOIP,telegram
ruleset=✈️Telegram,[]GEOSITE,telegram
ruleset=🎥Netflix,[]GEOIP,netflix
ruleset=🎥Netflix,[]GEOSITE,netflix
ruleset=🎬哔哩哔哩,[]GEOSITE,bilibili
ruleset=🌍主流媒体,https://gist.githubusercontent.com/fox-baixi/128a370090d45e8da2bf3dd2bca2f0e7/raw/Youtube.list
ruleset=🌍主流媒体,[]GEOSITE,category-media
ruleset=🍎苹果服务,[]GEOSITE,apple
ruleset=🚀直接连接,[]GEOIP,CN
ruleset=🚀直接连接,https://gist.githubusercontent.com/fox-baixi/128a370090d45e8da2bf3dd2bca2f0e7/raw/Local_Download.list
ruleset=🚀直接连接,[]GEOSITE,CN
ruleset=🚀直接连接,https://gist.githubusercontent.com/fox-baixi/128a370090d45e8da2bf3dd2bca2f0e7/raw/Direct.list
ruleset=🚀直接连接,https://gist.githubusercontent.com/fox-baixi/128a370090d45e8da2bf3dd2bca2f0e7/raw/Direct+.list
ruleset=⚓️其他流量,[]FINAL

;代理组定义 - 按指定顺序排列
custom_proxy_group=🔰国外流量`select`[]♻️自动选择`.*
custom_proxy_group=♻️自动选择`url-test`.*`http://cp.cloudflare.com/generate_204`300
custom_proxy_group=⚓️其他流量`select`[]🚀直接连接`[]🔰国外流量`.*
custom_proxy_group=⛔️广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=✈️Telegram`select`[]🔰国外流量`.*
custom_proxy_group=🎥Netflix`select`[]🔰国外流量`[]🚀直接连接`.*
custom_proxy_group=🎬哔哩哔哩`select`[]🚀直接连接`.*
custom_proxy_group=🌍主流媒体`select`[]🔰国外流量`[]🚀直接连接`.*
custom_proxy_group=🍎苹果服务`select`[]🚀直接连接`[]🔰国外流量
custom_proxy_group=🚀直接连接`select`[]DIRECT
custom_proxy_group=🛑Block`select`[]REJECT`[]DIRECT
custom_proxy_group=🎯Direct`select`[]DIRECT

enable_rule_generator=true
overwrite_original_rules=true
