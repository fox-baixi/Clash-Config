### DNS 配置开始 (只处理直连) ###
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver: 
    - 223.5.5.5
    - 1.1.1.1

  fake-ip-filter:
    - 'geosite:cn'
    - 'geosite:apple'
    - "rule-set:my_dns_rules"

  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query

  nameserver:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query


  nameserver-policy:
    'geosite:cn':
      - https://dns.alidns.com/dns-query
    'geosite:apple':
      - https://dns.alidns.com/dns-query
    "rule-set:my_dns_rules":
      - https://dns.alidns.com/dns-query
### DNS 配置结束 ###

proxy-groups:
  - name: 🔰国外流量
    type: select
    proxies:
      - ♻️自动选择
    # 这里的 filter 对应 INI 中的 .* 正则，意为选中所有节点
    include-all: true
    filter: ".*"

  - name: ♻️自动选择
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 30
    include-all: true
    filter: ".*"

  - name: ⚓️其他流量
    type: select
    proxies:
      - 🚀直接连接
      - ♻️自动选择
      - 🔰国外流量
    include-all: true
    filter: ".*"

  - name: ✈️Telegram
    type: select
    proxies:
      - 🔰国外流量
      - ♻️自动选择
      - 🚀直接连接
    include-all: true
    filter: ".*"

  - name: 🎥Netflix
    type: select
    proxies:
      - 🔰国外流量
      - ♻️自动选择
      - 🚀直接连接
    include-all: true
    filter: ".*"

  - name: 🎬国内媒体
    type: select
    proxies:
      - 🚀直接连接
      - ♻️自动选择
      - 🔰国外流量

  - name: 🌍主流媒体
    type: select
    proxies:
      - 🔰国外流量
      - ♻️自动选择
      - 🚀直接连接

  - name: 🍎苹果服务
    type: select
    proxies:
      - 🚀直接连接
      - ♻️自动选择
      - 🔰国外流量

  - name: ⛔️广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 🚀直接连接
    type: select
    proxies:
      - DIRECT



# 规则集提供者 (对应 INI 中的 ruleset URL)
# ⚠️ 注意: 由于源文件是纯文本列表格式，需要 Clash Meta (Mihomo) 内核支持
# ⚠️ 已添加 format: text 并在 URL 前增加 ghproxy.net 加速
rule-providers:
  Block:
    type: http
    behavior: classical
    format: text
    url: "https://ghproxy.net/https://gist.githubusercontent.com/fox-baixi/128a370090d45e8da2bf3dd2bca2f0e7/raw/Block.list"
    path: ./ruleset/Block.yaml
    interval: 86400

  BlockPlus:
    type: http
    behavior: classical
    format: text
    url: "https://ghproxy.net/https://gist.githubusercontent.com/fox-baixi/128a370090d45e8da2bf3dd2bca2f0e7/raw/Block+.list"
    path: ./ruleset/BlockPlus.yaml
    interval: 86400

  Foreign:
    type: http
    behavior: classical
    format: text
    url: "https://ghproxy.net/https://gist.githubusercontent.com/fox-baixi/128a370090d45e8da2bf3dd2bca2f0e7/raw/foreign.list"
    path: ./ruleset/Foreign.yaml
    interval: 86400

  ForeignPlus:
    type: http
    behavior: classical
    format: text
    url: "https://ghproxy.net/https://gist.githubusercontent.com/fox-baixi/128a370090d45e8da2bf3dd2bca2f0e7/raw/foreign+.list"
    path: ./ruleset/ForeignPlus.yaml
    interval: 86400

  Youtube:
    type: http
    behavior: classical
    format: text
    url: "https://ghproxy.net/https://gist.githubusercontent.com/fox-baixi/128a370090d45e8da2bf3dd2bca2f0e7/raw/Youtube.list"
    path: ./ruleset/Youtube.yaml
    interval: 86400

  LocalDownload:
    type: http
    behavior: classical
    format: text
