    path: ./ruleset/LocalDownload.yaml
    interval: 86400
    
  DirectList:
    type: http
    behavior: classical
    format: text
    url: "https://ghproxy.net/https://gist.githubusercontent.com/fox-baixi/128a370090d45e8da2bf3dd2bca2f0e7/raw/Direct.list"
    path: ./ruleset/Direct.yaml
    interval: 86400

  DirectPlus:
    type: http
    behavior: classical
    format: text
    url: "https://ghproxy.net/https://gist.githubusercontent.com/fox-baixi/128a370090d45e8da2bf3dd2bca2f0e7/raw/Direct+.list"
    path: ./ruleset/DirectPlus.yaml
    interval: 86400

  my_dns_rules:
    type: http
    behavior: domain
    url: "https://ghproxy.net/https://gist.githubusercontent.com/fox-baixi/128a370090d45e8da2bf3dd2bca2f0e7/raw/my_list.yaml"
    path: ./ruleset/my_list.yaml  # 手机本地缓存路径
    interval: 86400               # 自动更新间隔（秒），86400 是 24 小时

# 规则 (对应 INI 中的 ruleset 顺序)
rules:
  # 广告拦截
  - GEOIP,ad,⛔️广告拦截
  - GEOSITE,category-ads-all,⛔️广告拦截
  - RULE-SET,Block,⛔️广告拦截
  - RULE-SET,BlockPlus,⛔️广告拦截
  
  # 国外流量
  - RULE-SET,Foreign,🔰国外流量
  - RULE-SET,ForeignPlus,🔰国外流量
  
  # Telegram
  - GEOIP,telegram,✈️Telegram
  - GEOSITE,telegram,✈️Telegram
  
  # Netflix
  - GEOIP,netflix,🎥Netflix
  - GEOSITE,netflix,🎥Netflix
  
  # 国内媒体
  - GEOSITE,category-media-cn,🎬国内媒体
  
  # 主流媒体 (Youtube等)
  - RULE-SET,Youtube,🌍主流媒体
  - GEOSITE,category-media,🌍主流媒体
  
  # 苹果服务
  - GEOSITE,apple,🍎苹果服务
  
  # 直接连接
  - GEOIP,CN,🚀直接连接
  - RULE-SET,LocalDownload,🚀直接连接
  - GEOSITE,CN,🚀直接连接
  - RULE-SET,DirectList,🚀直接连接
  - RULE-SET,DirectPlus,🚀直接连接
  
  # 兜底规则
  - MATCH,⚓️其他流量
