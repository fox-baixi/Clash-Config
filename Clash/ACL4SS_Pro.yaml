# 规则 
rules:
  # 自定义
  - RULE-SET,AIServices,🤖AI-Services
  - RULE-SET,ForeignPlus,🔰国外流量
  
  # 广告拦截
  - GEOSITE,category-ads-all,⛔️广告拦截
  - RULE-SET,Block,⛔️广告拦截
  - RULE-SET,BlockPlus,⛔️广告拦截
  
  # Telegram
  - RULE-SET,Telegram,✈️Telegram
  - GEOIP,telegram,✈️Telegram
  - GEOSITE,telegram,✈️Telegram
  
  # Netflix
  - GEOIP,netflix,🎥Netflix
  - GEOSITE,netflix,🎥Netflix
  
  # 国内媒体
  - GEOSITE,category-media-cn,🎬国内媒体
  - RULE-SET,Bilibili,🎬国内媒体
  
  # 主流媒体
  - GEOSITE,category-media,🌍主流媒体

  # 微软大流量/更新下载（强制直连，防止偷跑代理流量）
  - GEOSITE,win-update,🚀直接连接
  - DOMAIN-SUFFIX,delivery.mp.microsoft.com,🚀直接连接
  - DOMAIN-SUFFIX,windowsupdate.com,🚀直接连接
  - DOMAIN-SUFFIX,update.microsoft.com,🚀直接连接
  - DOMAIN-SUFFIX,dl.delivery.mp.microsoft.com,🚀直接连接

  # 微软常规服务（可自由切换直连/代理）
  - GEOSITE,microsoft,Ⓜ️微软服务
  
  # 谷歌服务
  - GEOSITE,google,📢谷歌服务
  - GEOIP,google,📢谷歌服务
  
  # 苹果服务
  - GEOSITE,apple,🍎苹果服务
    
  # 国外流量
  - RULE-SET,Foreign,🔰国外流量

  # 直接连接
  - GEOIP,CN,🚀直接连接
  - RULE-SET,LocalDownload,🚀直接连接
  - GEOSITE,CN,🚀直接连接
  - RULE-SET,DirectList,🚀直接连接
  - RULE-SET,DirectPlus,🚀直接连接
  
  # 兜底规则
  - MATCH,⚓️其他流量
