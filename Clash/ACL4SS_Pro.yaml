
### 策略组 ###
proxy-groups:
  - name: 🔰国外流量
    type: select
    proxies:
      - ♻️自动选择
    # 这里的 filter 对应 INI 中的 .* 正则，意为选中所有节点
    include-all: true
    filter: ".*"

  - name: ♻️自动选择
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 50
    include-all: true
    # 这里的 filter 对应 INI 中的 .* 正则，意为选中所有节点
    # filter: ".*"
    # 这里的 filter 对应 INI 中的 ^(?!💤).* 正则，意为除了以 💤 开头的节点，都选中
    filter: "^(?!💤).*"

  - name: ⚓️其他流量
    type: select
    proxies:
      - 🚀直接连接
      - ♻️自动选择
      - 🔰国外流量
    include-all: true
    filter: ".*"

  - name: ✈️Telegram
    type: select
    proxies:
      - 🔰国外流量
      - ♻️自动选择
      - 🚀直接连接
    include-all: true
    filter: ".*"

  - name: 📢谷歌服务
    type: select
    proxies:
      - 🔰国外流量
      - ♻️自动选择
      - 🚀直接连接
    include-all: true
    filter: ".*"

  - name: 🤖AI-Services
    type: select
    proxies:
      - 🔰国外流量
      - ♻️自动选择
      - 🚀直接连接
    include-all: true
    filter: ".*"

  - name: 🎥Netflix
    type: select
    proxies:
      - 🔰国外流量
      - ♻️自动选择
      - 🚀直接连接
    include-all: true
    filter: ".*"

  - name: 🎬国内媒体
    type: select
    proxies:
      - 🚀直接连接
      - ♻️自动选择
      - 🔰国外流量

  - name: 🌍主流媒体
    type: select
    proxies:
      - 🔰国外流量
      - ♻️自动选择
      - 🚀直接连接

  - name: Ⓜ️微软服务
    type: select
    proxies:
      - 🚀直接连接
      - 🔰国外流量
      - ♻️自动选择

  - name: 🍎苹果服务
    type: select
    proxies:
      - 🚀直接连接
      - ♻️自动选择
      - 🔰国外流量

  - name: ⛔️广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 🚀直接连接
    type: select
    proxies:
      - DIRECT



