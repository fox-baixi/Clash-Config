dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  # ====================================================================
  # 🎯 开启白名单模式 (whitelist)：
  # 未在下面 fake-ip-filter 列出的域名（所有国内网站、未知域名）
  # 默认全部由阿里 DNS 解析并直接下发真实国内 IP（100% 走 31.1 直连）
  # ====================================================================
  fake-ip-filter-mode: whitelist

  # 🎯 仅在此列表中的【需要代理的域名】，才下发 198.18.x.x Fake-IP（转给 31.2 代理）
  # 完整收录 ACL4SS_Pro.yaml 中走代理的所有规则集与分类
  fake-ip-filter:
    - 'geosite:google'
    - 'geosite:telegram'
    - 'geosite:netflix'
    - 'geosite:category-media'
    - 'geosite:gfw'
    - 'geosite:geolocation-!cn'
    - 'geosite:microsoft'
    - 'geosite:apple'
    - 'rule-set:Foreign'
    - 'rule-set:ForeignPlus'
    - 'rule-set:AIServices'

  default-nameserver: 
    - 223.5.5.5

  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - 223.5.5.5

  # 默认国内真实 IP 解析使用的高速 DNS
  nameserver:
    - https://dns.alidns.com/dns-query
    - 223.5.5.5

  # 走代理的海外域名，统一使用海外安全加密 DNS 彻底防止污染
  nameserver-policy:
    # 🎯 广告域名在 DNS 阶段直接拒绝（0ms 本地秒回 Refused，消除网页转圈与无效查询）
    'geosite:category-ads-all': rcode://refused
    'rule-set:Block,BlockPlus': rcode://refused

    # 🎯 微软更新特例：虽属微软，但强制走国内阿里 DNS 获取国内就近 CDN 节点满速下载
    'geosite:win-update':
      - https://dns.alidns.com/dns-query
      - 223.5.5.5

    'geosite:google':
      - https://dns.google/dns-query
      - https://dns.cloudflare.com/dns-query
      - 8.8.8.8
      - 1.1.1.1
    'geosite:telegram':
      - https://dns.google/dns-query
      - https://dns.cloudflare.com/dns-query
      - 8.8.8.8
      - 1.1.1.1
    'geosite:netflix':
      - https://dns.google/dns-query
      - https://dns.cloudflare.com/dns-query
      - 8.8.8.8
      - 1.1.1.1
    'geosite:category-media':
      - https://dns.google/dns-query
      - https://dns.cloudflare.com/dns-query
      - 8.8.8.8
      - 1.1.1.1
    'geosite:microsoft':
      - https://dns.google/dns-query
      - https://dns.cloudflare.com/dns-query
      - 8.8.8.8
      - 1.1.1.1
    'geosite:apple':
      - https://dns.google/dns-query
      - https://dns.cloudflare.com/dns-query
      - 8.8.8.8
      - 1.1.1.1
    'geosite:gfw':
      - https://dns.google/dns-query
      - https://dns.cloudflare.com/dns-query
      - 8.8.8.8
      - 1.1.1.1
    'geosite:geolocation-!cn':
      - https://dns.google/dns-query
      - https://dns.cloudflare.com/dns-query
      - 1.1.1.1
      - 223.5.5.5
    'rule-set:Foreign':
      - https://dns.google/dns-query
      - https://dns.cloudflare.com/dns-query
      - 8.8.8.8
      - 1.1.1.1
    'rule-set:ForeignPlus':
      - https://dns.google/dns-query
      - https://dns.cloudflare.com/dns-query
      - 8.8.8.8
      - 1.1.1.1
    'rule-set:AIServices':
      - https://dns.google/dns-query
      - https://dns.cloudflare.com/dns-query
      - 8.8.8.8
      - 1.1.1.1
