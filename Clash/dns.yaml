dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver: 
    - 223.5.5.5
    - 8.8.8.8

  fake-ip-filter:
    - 'geosite:cn'
    - 'geosite:steam@cn'
    - 'rule-set:my_dns_rules'
    - 'steamcommunity.com'
    - '*.steamcommunity.com'

  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query

  nameserver:
    - https://dns.google/dns-query
    - https://dns.cloudflare.com/dns-query
    - https://dns.alidns.com/dns-query

  nameserver-policy:
    'geosite:cn':
      - https://dns.alidns.com/dns-query
    'geosite:steam@cn':
      - https://dns.alidns.com/dns-query
    'rule-set:my_dns_rules':
      - https://dns.alidns.com/dns-query
