dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  # ====================================================================
  # 🎯 保持白名单模式 (whitelist)：
  # 仅列表内的域名走 Fake-IP (走代理)，其余走国内加密 DNS 解析真实 IP 直连
  # ====================================================================
  fake-ip-filter-mode: whitelist

  fake-ip-filter:
    - 'geosite:google'
    - 'geosite:telegram'
    - 'geosite:netflix'
    - 'geosite:category-media'
    - 'geosite:gfw'
    - 'geosite:geolocation-!cn'
    - 'geosite:microsoft'
    - 'geosite:apple'
    - 'rule-set:Foreign'
    - 'rule-set:ForeignPlus'
    - 'rule-set:AIServices'

  # 基础引导解析：避免使用明文 UDP 53，采用 IP 形式的 DoT/DoH
  default-nameserver: 
    - 223.5.5.5
    - 119.29.29.29

  # 代理节点域名解析：全走国内高兼容 TLS / DoH
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - tls://223.5.5.5:853
    - tls://dot.pub:853

  # 默认国内真实 IP 解析：全量走国内 DoH / DoT，彻底杜绝明文 53 劫持
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - tls://223.5.5.5:853

  # 海外与代理域名的定向安全解析
  nameserver-policy:
    # 🎯 广告拦截
    'geosite:category-ads-all': rcode://refused
    'rule-set:Block,BlockPlus': rcode://refused

    # 🎯 微软更新特例：强制国内 DoH 获取国内满速 CDN
    'geosite:win-update':
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query

    # 🎯 海外规则集：全部走纯加密 DoH / DoT（移除所有 8.8.8.8/1.1.1.1 明文 UDP）
    'geosite:google':
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
      - tls://8.8.8.8:853
      - tls://1.1.1.1:853
    'geosite:telegram':
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
      - tls://8.8.8.8:853
      - tls://1.1.1.1:853
    'geosite:netflix':
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
      - tls://8.8.8.8:853
      - tls://1.1.1.1:853
    'geosite:category-media':
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
      - tls://8.8.8.8:853
      - tls://1.1.1.1:853
    'geosite:microsoft':
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
      - tls://8.8.8.8:853
      - tls://1.1.1.1:853
    'geosite:apple':
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
      - tls://8.8.8.8:853
      - tls://1.1.1.1:853
    'geosite:gfw':
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
      - tls://8.8.8.8:853
      - tls://1.1.1.1:853
    'geosite:geolocation-!cn':
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
      - tls://8.8.8.8:853
      - tls://1.1.1.1:853
    'rule-set:Foreign':
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
      - tls://8.8.8.8:853
      - tls://1.1.1.1:853
    'rule-set:ForeignPlus':
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
      - tls://8.8.8.8:853
      - tls://1.1.1.1:853
    'rule-set:AIServices':
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
      - tls://8.8.8.8:853
      - tls://1.1.1.1:853
